[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-per-file-ignores = { "app/api/*.py" = ["B008", "E501"], "app/seed_loader.py" = ["E501"], "app/services/fact_builder.py" = ["E501"], "app/services/sentinel.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
