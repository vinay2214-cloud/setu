services:
  - type: web
    name: setu-demo
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////app/data/setu.db
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: API_PROXY_TARGET
        value: http://127.0.0.1:8000
    disk:
      name: setu-data
      mountPath: /app/data
      sizeGB: 1
